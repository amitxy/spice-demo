name: Build & push slim server image

# Builds the SLIM variant (no models baked) from Dockerfile.slim and pushes it as
# the :slim tag. No HF token is needed at build time -- the slim image downloads
# models on first boot. Independent of the baked-in image workflow / :latest tag.
# Trigger manually (Actions tab -> "Run workflow") or by pushing a slim-v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "slim"
      cuda_archs:
        description: "CUDA architectures (semicolon-separated)"
        default: "80;86;89"
  push:
    tags:
      - "slim-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.slim
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/spice-demo:${{ github.event.inputs.tag || 'slim' }}
          build-args: |
            CUDA_ARCHS=${{ github.event.inputs.cuda_archs || '80;86;89' }}
