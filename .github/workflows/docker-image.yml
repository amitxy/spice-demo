name: Build & push server image

# Builds the self-contained inference-server image and pushes it to ghcr.
# Trigger manually (Actions tab -> "Run workflow") or by pushing a v* tag.
# The image bakes in ~10.7 GB of models, so this is intentionally NOT run on
# every commit (slow CUDA compile + large push). HF token comes from the
# HF_TOKEN repo secret and is passed as a BuildKit secret (never in a layer).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        default: "latest"
      cuda_archs:
        description: "CUDA architectures (semicolon-separated)"
        default: "80;86;89"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # The image is ~13 GB; default runners have too little free disk.
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: false

      # The runtime stage copies the ~10.7 GB models into a new layer (so models
      # exist twice on disk) on top of the CUDA devel layer. Point Docker at the
      # runner's larger /mnt disk (~65 GB) so the final stage doesn't run out of
      # space after the long compile. Must happen before the buildx builder starts.
      - name: Move Docker storage to the larger /mnt disk
        run: |
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker root dir: {{.DockerRootDir}}'
          df -h /mnt /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/spice-demo:${{ github.event.inputs.tag || 'latest' }}
          build-args: |
            CUDA_ARCHS=${{ github.event.inputs.cuda_archs || '80;86;89' }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
